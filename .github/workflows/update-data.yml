name: Update game data

on:
  schedule:
    - cron: "23 11 * * *"   # daily, ~6am Central: picks up Saturday CFB, Sunday NFL and Monday night results
  workflow_dispatch:
    inputs:
      full:
        description: "Refetch every season since 2010"
        type: boolean
        default: false
  push:
    paths:
      - "scripts/fetch_games.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch games
        run: |
          mkdir -p data
          set -o pipefail
          python3 scripts/fetch_games.py ${{ (inputs.full && '--full') || '' }} 2>&1 | tee data/fetch-log.txt
      - name: Commit if changed
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update game data"
          git push
