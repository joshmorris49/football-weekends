<!doctype html>
<!-- Source for ../og.png (1200x630 link preview). Render: python3 scripts/og.py -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#13261b;color:#f4f6f1;font-family:"TeX Gyre Heros Cn",sans-serif;position:relative}
.copy{position:absolute;left:72px;top:70px;width:560px}
.k{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:24px;color:#a9bcae}
h1{font-weight:700;text-transform:uppercase;font-size:74px;line-height:.95;margin-top:16px}
p{font-family:"Inter",sans-serif;font-size:26px;line-height:1.38;margin-top:24px;color:#d4ded6}
.url{position:absolute;left:72px;bottom:56px;font-weight:700;font-size:26px;letter-spacing:.05em;color:#a9bcae}
.grid{position:absolute;right:64px;top:92px;display:grid;grid-template-columns:repeat(9,40px);gap:14px}
.d{width:40px;height:40px;border-radius:50%}
.g{background:#35c072}.s{background:#e8ad3a}.b{background:#ec6457}.o{box-shadow:inset 0 0 0 4px #55605a}
</style></head><body>
<div class="copy">
  <div class="k">College + NFL · since 2010</div>
  <h1>How good were your football weekends?</h1>
  <p>Pick your college team and your NFL team. A good weekend is one where both won.</p>
</div>
<div class="url">joshmorris49.github.io/football-weekends</div>
<div class="grid" id="g"></div>
<script>
const rows=["ogsgsgobg","sggogsggs","ogbsgogsg","gsgogbsgo","sggsgogsg","ogsgbgsog","gsogsggbs","sgggosgso"];
document.getElementById("g").innerHTML=rows.join("").split("").map(c=>`<span class="d ${c}"></span>`).join("");
</script></body></html>
